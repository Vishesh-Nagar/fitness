server:
  port: 8083

spring:
  data:
    mongodb:
      # Docker Compose overrides SPRING_DATA_MONGODB_URI with the mongodb container hostname.
      # Falls back to localhost for plain local development.
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/fitnessrecommendation}
      database: fitnessrecommendation
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring:
          json:
            trusted:
              packages: com.fitness.*

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}