networks:
  fitness-net:
    driver: bridge

services:

  # ─────────────────────── Infrastructure ───────────────────────

  mongodb:
    image: mongo:6.0
    container_name: fitness-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo-data:/data/db
    networks:
      - fitness-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: fitness-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fitness_user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin@123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fitness-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # KRaft mode: single-node Kafka — no Zookeeper needed
  kafka:
    image: bitnami/kafka:3.7
    container_name: fitness-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - fitness-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────── Spring Cloud Config ───────────────────────

  configserver:
    build:
      context: ./configserver
      dockerfile: Dockerfile
    container_name: fitness-configserver
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      - fitness-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────── Service Discovery ───────────────────────

  eureka:
    build:
      context: ./eureka
      dockerfile: Dockerfile
    container_name: fitness-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
    networks:
      - fitness-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────── API Gateway ───────────────────────

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: fitness-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    networks:
      - fitness-net

  # ─────────────────────── Microservices ───────────────────────

  userservice:
    build:
      context: ./userservice
      dockerfile: Dockerfile
    container_name: fitness-userservice
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/fitness_user_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin@123
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    networks:
      - fitness-net

  activityservice:
    build:
      context: ./activityservice
      dockerfile: Dockerfile
    container_name: fitness-activityservice
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATA_MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/fitnessactivity?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - fitness-net

  aiservice:
    build:
      context: ./aiservice
      dockerfile: Dockerfile
    container_name: fitness-aiservice
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATA_MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/fitnessrecommendation?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_URL=${GEMINI_API_URL}
    networks:
      - fitness-net

  # ─────────────────────── Frontend ───────────────────────

  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: fitness-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway
    networks:
      - fitness-net

volumes:
  mongo-data:
  postgres-data:
